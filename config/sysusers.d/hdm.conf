# See systemd-sysusers(8). Only needed if you opt into
# [general] -> greeter_user => _hdm in hdm.hk (unset by default — the
# greeter runs as root out of the box, see daemon/src/main.rs and the
# README's Compositor section). Not installed/applied automatically by
# anything in this repo; a packaging script can run
# `systemd-sysusers hdm.conf`, or apply it manually the same way.
#
# Creates the unprivileged system user and adds it to the groups cage
# typically needs to open /dev/dri and /dev/input directly. This alone
# does NOT grant a full seat — for reliable device access you'll still
# want either udev rules or an active seatd/systemd-logind session for
# this user.
#Type Name  ID  GECOS          Home  Shell
u     _hdm  -   "HDM Greeter"  -     -
m     _hdm  video
m     _hdm  render
m     _hdm  input
m     _hdm  seat
